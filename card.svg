<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0b1020"/><stop offset="55%" stop-color="#0d1117"/><stop offset="100%" stop-color="#111b2e"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353"/><stop offset="50%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#bc8cff"/>
  <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
