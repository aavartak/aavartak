.name{fill:#58a6ff;font-size:18px;font-weight:700}
.art{fill:#39d353;font-size:10.2px;letter-spacing:.5px}
.row{opacity:0;animation:in .5s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cursor{animation:blink 1s step-end infinite}
.portrait{animation:float 6s ease-in-out infinite;transform-origin:center}
</style></defs>
