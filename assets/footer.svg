<svg xmlns="http://www.w3.org/2000/svg" width="980" height="140" viewBox="0 0 980 140" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#111a2b"/><stop offset="100%" stop-color="#0d1117"/>
</linearGradient>
<linearGradient id="fw1" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353" stop-opacity=".4"/><stop offset="100%" stop-color="#58a6ff" stop-opacity=".4"/>
</linearGradient>
<linearGradient id="fw2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#bc8cff" stop-opacity=".3"/><stop offset="100%" stop-color="#39c5cf" stop-opacity=".3"/>
</linearGradient>
<linearGradient id="ftext" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#39d353"/><stop offset="100%" stop-color="#bc8cff"/>
  <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="1;2;1" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<filter id="fglow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="fclip"><rect x="0" y="0" width="980" height="140" rx="14"/></clipPath>
<style>
@keyframes fblink{50%{opacity:0}}
.fc{animation:fblink .9s step-end infinite}
</style>
</defs>

<rect width="980" height="140" rx="14" fill="url(#fbg)"/>

<g clip-path="url(#fclip)">
  <g>
    <path d="M0 62 Q 122 42 245 62 T 490 62 T 735 62 T 980 62 T 1225 62 V 140 H 0 Z" fill="url(#fw1)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-490 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 76 Q 122 96 245 76 T 490 76 T 735 76 T 980 76 T 1225 76 V 140 H 0 Z" fill="url(#fw2)">
      <animateTransform attributeName="transform" type="translate" values="-490 0;0 0" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#c9d1d9">
    <circle cx="140" cy="28" r="1.4"><animate attributeName="opacity" values=".15;.9;.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="18" r="1.2"><animate attributeName="opacity" values=".9;.1;.9" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="26" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="16" r="1.2"><animate attributeName="opacity" values=".8;.1;.8" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <text x="490" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="url(#ftext)" filter="url(#fglow)">thanks for scrolling ✦ let's build something
  </text>
  <text x="490" y="70" text-anchor="middle" font-size="12.5" fill="#8b949e">$ git commit -m "keep going"<tspan class="fc" fill="#39d353"> ▌</tspan></text>

  <g>
    <circle cx="0" cy="110" r="3" fill="#39d353" filter="url(#fglow)">
      <animate attributeName="cx" values="60;920;60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;96;110" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="118" r="2" fill="#bc8cff" opacity=".8" filter="url(#fglow)">
      <animate attributeName="cx" values="920;60;920" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="118;104;118" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>

<rect x=".8" y=".8" width="978.4" height="138.4" rx="14" fill="none" stroke="#30363d"/>
<rect x=".8" y=".8" width="978.4" height="138.4" rx="14" fill="none" stroke="#bc8cff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="110 2100" filter="url(#fglow)">
  <animate attributeName="stroke-dashoffset" values="-2210;0" dur="8s" repeatCount="indefinite"/>
</rect>
</svg>