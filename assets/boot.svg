<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
<defs>
<linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0a0e18"/><stop offset="60%" stop-color="#0d1117"/><stop offset="100%" stop-color="#101827"/>
</linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353"/><stop offset="55%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#bc8cff"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353"/><stop offset="50%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#bc8cff"/>
  <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#39d353" stop-opacity="0"/><stop offset="80%" stop-color="#39d353" stop-opacity=".55"/><stop offset="100%" stop-color="#7ee787" stop-opacity=".9"/>
</linearGradient>
<filter id="tglow"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="tclip"><rect x="0" y="0" width="980" height="400" rx="16"/></clipPath>
<clipPath id="L1"><rect x="34" y="76" width="0" height="22"><animate attributeName="width" values="0;250" dur="1s" begin="0.2s" fill="freeze"/></rect></clipPath>
<clipPath id="L2"><rect x="34" y="106" width="0" height="22"><animate attributeName="width" values="0;280" dur=".9s" begin="1.4s" fill="freeze"/></rect></clipPath>
<clipPath id="L3"><rect x="34" y="136" width="0" height="22"><animate attributeName="width" values="0;330" dur="1s" begin="2.4s" fill="freeze"/></rect></clipPath>
<clipPath id="L4"><rect x="34" y="166" width="0" height="22"><animate attributeName="width" values="0;380" dur="1.1s" begin="3.5s" fill="freeze"/></rect></clipPath>
<clipPath id="L5"><rect x="34" y="196" width="0" height="22"><animate attributeName="width" values="0;350" dur="1s" begin="4.7s" fill="freeze"/></rect></clipPath>
<clipPath id="L6"><rect x="34" y="226" width="0" height="22"><animate attributeName="width" values="0;300" dur=".9s" begin="5.8s" fill="freeze"/></rect></clipPath>
<clipPath id="L7"><rect x="34" y="330" width="0" height="24"><animate attributeName="width" values="0;420" dur="1.1s" begin="10.4s" fill="freeze"/></rect></clipPath>
<clipPath id="barClip"><rect x="34" y="266" width="620" height="12" rx="6"/></clipPath>
<style>
.ln{font-size:13.5px;fill:#c9d1d9}
.ok{fill:#39d353;font-weight:700}
.wn{fill:#ffbd2e;font-weight:700}
.pr{fill:#58a6ff;font-weight:700}
.dim{fill:#8b949e}
.rn{font-size:11px;font-family:monospace}
@keyframes tblink{50%{opacity:0}}
.cur{animation:tblink .8s step-end infinite}
</style>
</defs>

<rect width="980" height="400" rx="16" fill="url(#tbg)"/>

<g clip-path="url(#tclip)">
  <g class="rn" fill="url(#rain)" opacity=".5" xml:space="preserve">
    <text x="742" y="0" writing-mode="tb">01001010110<animate attributeName="y" values="-160;420" dur="7s" repeatCount="indefinite"/></text>
    <text x="778" y="0" writing-mode="tb">1101001011<animate attributeName="y" values="-220;420" dur="9s" begin="1.2s" repeatCount="indefinite"/></text>
    <text x="814" y="0" writing-mode="tb">0010110101<animate attributeName="y" values="-180;420" dur="6s" begin="2.4s" repeatCount="indefinite"/></text>
    <text x="850" y="0" writing-mode="tb">1010011010<animate attributeName="y" values="-260;420" dur="10s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="886" y="0" writing-mode="tb">0110100111<animate attributeName="y" values="-200;420" dur="8s" begin="3.1s" repeatCount="indefinite"/></text>
    <text x="922" y="0" writing-mode="tb">1001101001<animate attributeName="y" values="-150;420" dur="11s" begin="4.4s" repeatCount="indefinite"/></text>
  </g>

  <rect x="0" y="0" width="980" height="46" fill="#161b22"/>
  <line x1="0" y1="46" x2="980" y2="46" stroke="#30363d"/>
  <circle cx="30" cy="23" r="6" fill="#ff5f56"><animate attributeName="opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="50" cy="23" r="6" fill="#ffbd2e"><animate attributeName="opacity" values="1;.45;1" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="70" cy="23" r="6" fill="#27c93f"><animate attributeName="opacity" values="1;.45;1" dur="4.4s" repeatCount="indefinite"/></circle>
  <text x="102" y="28" class="ln dim" font-size="12.5">aavartak@dev — /usr/bin/boot</text>
  <g>
    <circle cx="920" cy="23" r="3.4" fill="#39d353"/>
    <circle cx="920" cy="23" r="3.4" fill="none" stroke="#39d353" stroke-width="1.2">
      <animate attributeName="r" values="3.4;12" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="932" y="27" class="dim" font-size="10.5">live</text>
  </g>

  <g clip-path="url(#L1)"><text x="34" y="92" class="ln"><tspan class="ok">$</tspan> ./boot --profile aavartak</text></g>
  <g clip-path="url(#L2)"><text x="34" y="122" class="ln"><tspan class="ok">[ ok ]</tspan> mounting /dev/curiosity</text></g>
  <g clip-path="url(#L3)"><text x="34" y="152" class="ln"><tspan class="ok">[ ok ]</tspan> loading module persistence.ko</text></g>
  <g clip-path="url(#L4)"><text x="34" y="182" class="ln"><tspan class="ok">[ ok ]</tspan> injecting caffeine into main thread</text></g>
  <g clip-path="url(#L5)"><text x="34" y="212" class="ln"><tspan class="wn">[warn]</tspan> sleep.service failed — as expected</text></g>
  <g clip-path="url(#L6)"><text x="34" y="242" class="ln"><tspan class="pr">[ .. ]</tspan> compiling ambition</text></g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="6.6s" dur=".3s" fill="freeze"/>
    <rect x="34" y="266" width="620" height="12" rx="6" fill="#161b22" stroke="#30363d" stroke-width=".8"/>
    <rect x="34" y="266" width="0" height="12" rx="6" fill="url(#bar)">
      <animate attributeName="width" values="0;620" dur="3.6s" begin="6.8s" fill="freeze"/>
    </rect>
    <g clip-path="url(#barClip)">
      <rect x="34" y="266" width="60" height="12" fill="#ffffff" opacity=".22">
        <animate attributeName="x" values="0;660" dur="1.8s" begin="6.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="34" cy="272" r="5" fill="#7ee787" filter="url(#tglow)">
      <animate attributeName="cx" values="34;654" dur="3.6s" begin="6.8s" fill="freeze"/>
    </circle>

    <g font-size="13" font-weight="700" fill="#7ee787" text-anchor="end">
      <text x="712" y="277" opacity="0">  0%<animate attributeName="opacity" values="1;1;0" keyTimes="0;0.14;0.15" dur="3.6s" begin="6.8s" fill="freeze"/></text>
      <text x="712" y="277" opacity="0"> 18%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.16;0.31;0.32" dur="3.6s" begin="6.8s" fill="freeze"/></text>
      <text x="712" y="277" opacity="0"> 37%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.33;0.49;0.5" dur="3.6s" begin="6.8s" fill="freeze"/></text>
      <text x="712" y="277" opacity="0"> 56%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.67;0.68" dur="3.6s" begin="6.8s" fill="freeze"/></text>
      <text x="712" y="277" opacity="0"> 74%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.69;0.85;0.86" dur="3.6s" begin="6.8s" fill="freeze"/></text>
      <text x="712" y="277" opacity="0"> 91%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.86;0.87;0.96;0.97" dur="3.6s" begin="6.8s" fill="freeze"/></text>
      <text x="712" y="277" opacity="0">100%<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.97;0.98" dur="3.6s" begin="6.8s" fill="freeze"/></text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="10.2s" dur=".4s" fill="freeze"/>
    <text x="34" y="304" class="ln dim" font-size="12">kernel: humans-first · shell: kindness · fs: ext-curious</text>
  </g>

  <g clip-path="url(#L7)">
    <text x="34" y="348" class="ln" font-size="15" fill="#7ee787" filter="url(#tglow)">✔ profile ready — scroll on, friend</text>
  </g>
  <text x="34" y="348" class="ln cur" font-size="15" fill="#39d353" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="11.5s" dur=".1s" fill="freeze"/>
    <tspan dx="424">▌</tspan>
  </text>

  <rect x="0" y="-70" width="980" height="70" fill="#58a6ff" opacity=".05">
    <animate attributeName="y" values="-70;400" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x=".9" y=".9" width="978.2" height="398.2" rx="16" fill="none" stroke="#30363d"/>
<rect x=".9" y=".9" width="978.2" height="398.2" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" stroke-dasharray="160 2600" filter="url(#tglow)">
  <animate attributeName="stroke-dashoffset" values="0;-2760" dur="7.5s" repeatCount="indefinite"/>
</rect>
</svg>