<svg xmlns="http://www.w3.org/2000/svg" width="980" height="150" viewBox="0 0 980 150" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
<defs>
<linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#111a2b"/>
</linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
  <stop offset="8%" stop-color="#0d1117" stop-opacity="0"/>
  <stop offset="92%" stop-color="#0d1117" stop-opacity="0"/>
  <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
</linearGradient>
<filter id="sglow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="sclip"><rect x="0" y="0" width="980" height="150" rx="14"/></clipPath>
<style>
.t{font-size:12.5px;font-weight:700}
.hd{font-size:13px;font-weight:700;fill:#f0883e}
.pill{opacity:0;animation:pin .55s cubic-bezier(.2,1.5,.3,1) forwards}
@keyframes pin{from{opacity:0;transform:translateY(10px) scale(.86)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fl{animation:hover 3.6s ease-in-out infinite}
</style>
</defs>

<rect width="980" height="150" rx="14" fill="url(#sbg)"/>

<g clip-path="url(#sclip)">
  <g stroke="#30363d" stroke-width=".6" opacity=".5">
    <path d="M0 40h980M0 105h980"/>
  </g>

  <text x="28" y="28" class="hd">— tech arsenal</text>
  <circle cx="196" cy="23" r="3" fill="#39d353"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>

  <g class="pill fl" style="animation-delay:.10s">
    <rect x="28" y="52" width="92" height="34" rx="17" fill="#161b22" stroke="#39d353" stroke-width="1.1"/>
    <text x="74" y="73" class="t" fill="#7ee787" text-anchor="middle">C / C++</text>
  </g>
  <g class="pill fl" style="animation-delay:.20s">
    <rect x="132" y="52" width="80" height="34" rx="17" fill="#161b22" stroke="#58a6ff" stroke-width="1.1"/>
    <text x="172" y="73" class="t" fill="#79c0ff" text-anchor="middle">React</text>
  </g>
  <g class="pill fl" style="animation-delay:.30s">
    <rect x="224" y="52" width="72" height="34" rx="17" fill="#161b22" stroke="#f0883e" stroke-width="1.1"/>
    <text x="260" y="73" class="t" fill="#ffbd2e" text-anchor="middle">HTML</text>
  </g>
  <g class="pill fl" style="animation-delay:.40s">
    <rect x="308" y="52" width="64" height="34" rx="17" fill="#161b22" stroke="#39c5cf" stroke-width="1.1"/>
    <text x="340" y="73" class="t" fill="#56d4dd" text-anchor="middle">CSS</text>
  </g>
  <g class="pill fl" style="animation-delay:.50s">
    <rect x="384" y="52" width="124" height="34" rx="17" fill="#161b22" stroke="#bc8cff" stroke-width="1.1"/>
    <text x="446" y="73" class="t" fill="#d2a8ff" text-anchor="middle">PostgreSQL</text>
  </g>
  <g class="pill fl" style="animation-delay:.60s">
    <rect x="520" y="52" width="76" height="34" rx="17" fill="#161b22" stroke="#58a6ff" stroke-width="1.1"/>
    <text x="558" y="73" class="t" fill="#79c0ff" text-anchor="middle">Git</text>
  </g>
  <g class="pill fl" style="animation-delay:.70s">
    <rect x="608" y="52" width="104" height="34" rx="17" fill="#161b22" stroke="#39d353" stroke-width="1.1"/>
    <text x="660" y="73" class="t" fill="#7ee787" text-anchor="middle">VS Code</text>
  </g>
  <g class="pill fl" style="animation-delay:.80s">
    <rect x="724" y="52" width="140" height="34" rx="17" fill="#161b22" stroke="#ff7b72" stroke-width="1.1"/>
    <text x="794" y="73" class="t" fill="#ffa198" text-anchor="middle">Cyber Security</text>
  </g>
  <g class="pill fl" style="animation-delay:.90s">
    <rect x="876" y="52" width="76" height="34" rx="17" fill="#161b22" stroke="#8b949e" stroke-width="1.1"/>
    <text x="914" y="73" class="t" fill="#c9d1d9" text-anchor="middle">Linux</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-980 0" dur="18s" repeatCount="indefinite"/>
    <g fill="#8b949e" font-size="12" opacity=".75">
      <text x="28" y="128">pointers ▸ data structures ▸ algorithms ▸ os internals ▸ networking ▸ sql ▸ react hooks ▸ responsive ui ▸ threat modeling ▸</text>
      <text x="1008" y="128">pointers ▸ data structures ▸ algorithms ▸ os internals ▸ networking ▸ sql ▸ react hooks ▸ responsive ui ▸ threat modeling ▸</text>
    </g>
  </g>

  <rect x="0" y="112" width="980" height="22" fill="url(#fade)"/>

  <rect x="0" y="-40" width="980" height="40" fill="#58a6ff" opacity=".05">
    <animate attributeName="y" values="-40;150" dur="8s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x=".8" y=".8" width="978.4" height="148.4" rx="14" fill="none" stroke="#30363d"/>
<rect x=".8" y=".8" width="978.4" height="148.4" rx="14" fill="none" stroke="#39d353" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="120 2100" filter="url(#sglow)">
  <animate attributeName="stroke-dashoffset" values="0;-2220" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>