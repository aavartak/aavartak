<svg xmlns="http://www.w3.org/2000/svg" width="980" height="230" viewBox="0 0 980 230" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
<defs>
<linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#080c17"/><stop offset="50%" stop-color="#0d1117"/><stop offset="100%" stop-color="#151f34"/>
</linearGradient>
<radialGradient id="aur1" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#39d353" stop-opacity=".55"/><stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aur2" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#bc8cff" stop-opacity=".5"/><stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aur3" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#58a6ff" stop-opacity=".45"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="htext" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353"/><stop offset="40%" stop-color="#58a6ff"/><stop offset="75%" stop-color="#bc8cff"/><stop offset="100%" stop-color="#39c5cf"/>
  <animate attributeName="x1" values="-1.2;0.2;-1.2" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="0.8;2.2;0.8" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="uline" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353" stop-opacity="0"/><stop offset="50%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
</linearGradient>
<filter id="hglow"><feGaussianBlur stdDeviation="2.6" result="b"><animate attributeName="stdDeviation" values="1.8;3.6;1.8" dur="4.5s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="hsoft"><feGaussianBlur stdDeviation="16"/></filter>
<clipPath id="hclip"><rect x="0" y="0" width="980" height="230" rx="16"/></clipPath>
<clipPath id="gA"><rect x="0" y="52" width="980" height="14"><animate attributeName="y" values="52;74;58;80;52" dur="3.4s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="gB"><rect x="0" y="72" width="980" height="10"><animate attributeName="y" values="86;60;92;66;86" dur="2.9s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
<style>
.h1{font-size:34px;font-weight:700;letter-spacing:1px}
.sub{font-size:13.5px;fill:#8b949e}
.gl{font-size:11px;fill:#39d353;opacity:.5}
@keyframes hblink{50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.cur{animation:hblink .85s step-end infinite}
.bob{animation:bob 4.5s ease-in-out infinite}
.swing{animation:swing 6s ease-in-out infinite;transform-origin:490px 90px}
</style>
</defs>

<rect width="980" height="230" rx="16" fill="url(#hbg)"/>

<g clip-path="url(#hclip)">
  <g filter="url(#hsoft)">
    <circle cx="180" cy="60" r="90" fill="url(#aur1)">
      <animate attributeName="cx" values="140;300;140" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;110;50" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="170" r="100" fill="url(#aur2)">
      <animate attributeName="cx" values="860;660;860" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;90;180" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="200" r="110" fill="url(#aur3)">
      <animate attributeName="cy" values="220;140;220" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="r" values="90;130;90" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#c9d1d9">
    <circle cx="60" cy="30" r="1.1"><animate attributeName="opacity" values=".1;.9;.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="196" r="1.3"><animate attributeName="opacity" values=".85;.1;.85" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="268" cy="42" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="392" cy="206" r="1.2"><animate attributeName="opacity" values=".9;.15;.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="34" r="1.1"><animate attributeName="opacity" values=".15;.8;.15" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="204" r="1.3"><animate attributeName="opacity" values=".8;.1;.8" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="46" r="1"><animate attributeName="opacity" values=".2;.95;.2" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <g class="gl" xml:space="preserve">
    <text x="52" y="230">{ }<animate attributeName="y" values="240;-14" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.55;0" dur="13s" repeatCount="indefinite"/></text>
    <text x="196" y="230">&lt;/&gt;<animate attributeName="y" values="240;-14" dur="16s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="16s" begin="2s" repeatCount="indefinite"/></text>
    <text x="704" y="230">0x1F<animate attributeName="y" values="240;-14" dur="15s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="15s" begin="4s" repeatCount="indefinite"/></text>
    <text x="866" y="230">++i<animate attributeName="y" values="240;-14" dur="12s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.55;0" dur="12s" begin="6s" repeatCount="indefinite"/></text>
    <text x="428" y="230">NULL<animate attributeName="y" values="240;-14" dur="18s" begin="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.45;0" dur="18s" begin="7.5s" repeatCount="indefinite"/></text>
  </g>

  <g class="bob">
    <circle cx="86" cy="115" r="30" fill="none" stroke="#39d353" stroke-width="1.1" stroke-dasharray="5 7" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" from="0 86 115" to="360 86 115" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="115" r="19" fill="none" stroke="#58a6ff" stroke-width="1.1" stroke-dasharray="3 9" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" from="360 86 115" to="0 86 115" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="115" r="5.5" fill="#bc8cff" filter="url(#hglow)"><animate attributeName="r" values="4;7;4" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="86" cy="85" r="2" fill="#39d353">
      <animateTransform attributeName="transform" type="rotate" from="0 86 115" to="360 86 115" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="bob" style="animation-delay:1.1s">
    <circle cx="894" cy="115" r="30" fill="none" stroke="#bc8cff" stroke-width="1.1" stroke-dasharray="5 7" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" from="360 894 115" to="0 894 115" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="894" cy="115" r="19" fill="none" stroke="#39c5cf" stroke-width="1.1" stroke-dasharray="3 9" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" from="0 894 115" to="360 894 115" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="894" cy="115" r="5.5" fill="#39d353" filter="url(#hglow)"><animate attributeName="r" values="7;4;7" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="894" cy="145" r="2" fill="#58a6ff">
      <animateTransform attributeName="transform" type="rotate" from="0 894 115" to="-360 894 115" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="swing" text-anchor="middle">
    <text x="490" y="92" class="h1" fill="#ff5f56" opacity=".5" clip-path="url(#gA)">aavartak
      <animate attributeName="dx" values="-3;2;-4;3;-3" dur="3.4s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="490" y="92" class="h1" fill="#39c5cf" opacity=".5" clip-path="url(#gB)">aavartak
      <animate attributeName="dx" values="3;-2;4;-3;3" dur="2.9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="490" y="92" class="h1" fill="url(#htext)" filter="url(#hglow)">aavartak</text>
  </g>

  <path d="M300 108 H680" stroke="url(#uline)" stroke-width="2" fill="none" stroke-dasharray="380" stroke-dashoffset="380">
    <animate attributeName="stroke-dashoffset" from="380" to="0" dur="1.6s" fill="freeze"/>
  </path>
  <circle cx="300" cy="108" r="2.8" fill="#39d353" filter="url(#hglow)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.4s" dur=".3s" fill="freeze"/>
    <animate attributeName="cx" values="300;680;300" dur="5s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="5s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <g text-anchor="middle">
    <text x="490" y="136" class="sub" opacity="0">computer engineer · builds it, breaks it, then builds it better
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.29;0.34" dur="13s" begin="1.6s" repeatCount="indefinite"/>
    </text>
    <text x="490" y="136" class="sub" opacity="0">pointer arithmetic by day · pixel pushing by night
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.42;0.63;0.68" dur="13s" begin="1.6s" repeatCount="indefinite"/>
    </text>
    <text x="490" y="136" class="sub" opacity="0">reads logs for fun · patches things before they page you
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.76;0.96;1" dur="13s" begin="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g>
    <rect x="392" y="156" width="196" height="7" rx="3.5" fill="#161b22" stroke="#30363d" stroke-width=".7"/>
    <rect x="392" y="156" width="0" height="7" rx="3.5" fill="url(#htext)">
      <animate attributeName="width" values="0;196;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="392" cy="159.5" r="4" fill="#39d353" filter="url(#hglow)">
      <animate attributeName="cx" values="392;588;392" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#39d353" stroke-width="1.6" fill="none" opacity=".8">
    <path d="M16 40V24a8 8 0 0 1 8-8h18"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></path>
    <path d="M964 40V24a8 8 0 0 0-8-8h-18"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></path>
    <path d="M16 190v16a8 8 0 0 0 8 8h18"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></path>
    <path d="M964 190v16a8 8 0 0 1-8 8h-18"><animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/></path>
  </g>
</g>

<rect x=".9" y=".9" width="978.2" height="228.2" rx="16" fill="none" stroke="#30363d"/>
<rect x=".9" y=".9" width="978.2" height="228.2" rx="16" fill="none" stroke="url(#htext)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="150 2250" filter="url(#hglow)">
  <animate attributeName="stroke-dashoffset" values="0;-2400" dur="6.5s" repeatCount="indefinite"/>
</rect>
</svg>