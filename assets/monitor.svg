<svg xmlns="http://www.w3.org/2000/svg" width="980" height="230" viewBox="0 0 980 230" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
<defs>
<linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#111a2b"/>
</linearGradient>
<linearGradient id="ekg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353"/><stop offset="60%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#bc8cff"/>
</linearGradient>
<linearGradient id="fillArea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#39d353" stop-opacity=".35"/><stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
</linearGradient>
<linearGradient id="medge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39c5cf"/><stop offset="50%" stop-color="#39d353"/><stop offset="100%" stop-color="#58a6ff"/>
  <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="mgrid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#8b949e" stroke-width=".5" opacity=".12"/>
</pattern>
<filter id="mglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="mclip"><rect x="0" y="0" width="980" height="230" rx="14"/></clipPath>
<clipPath id="waveClip"><rect x="28" y="52" width="560" height="120"/></clipPath>
<style>
.hd{font-size:12.5px;font-weight:700;fill:#f0883e}
.lb{font-size:11px;fill:#8b949e}
.vl{font-size:15px;font-weight:700}
@keyframes mblink{50%{opacity:0}}
.cur{animation:mblink .9s step-end infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.rise{opacity:0;animation:rise .6s cubic-bezier(.2,.9,.2,1) forwards}
</style>
</defs>

<rect width="980" height="230" rx="14" fill="url(#mbg)"/>

<g clip-path="url(#mclip)">
  <rect x="28" y="52" width="560" height="120" fill="url(#mgrid)"/>

  <text x="28" y="34" class="hd">— vitals monitor</text>
  <text x="176" y="34" class="lb">realtime · totally scientific</text>
  <circle cx="360" cy="30" r="3" fill="#39d353"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>

  <g clip-path="url(#waveClip)">
    <path d="M28 130 L70 130 L82 106 L94 152 L106 130 L150 130 L162 96 L174 160 L186 130 L232 130 L244 112 L256 148 L268 130 L316 130 L328 88 L340 166 L352 130 L400 130 L412 116 L424 146 L436 130 L484 130 L496 100 L508 158 L520 130 L568 130 L588 130"
          fill="none" stroke="url(#ekg)" stroke-width="2.2" stroke-linejoin="round" filter="url(#mglow)"
          stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" values="1400;0" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M28 130 L70 130 L82 106 L94 152 L106 130 L150 130 L162 96 L174 160 L186 130 L232 130 L244 112 L256 148 L268 130 L316 130 L328 88 L340 166 L352 130 L400 130 L412 116 L424 146 L436 130 L484 130 L496 100 L508 158 L520 130 L568 130 L588 130 L588 172 L28 172 Z"
          fill="url(#fillArea)" opacity=".45"/>
    <rect x="28" y="52" width="16" height="120" fill="#7ee787" opacity=".25">
      <animate attributeName="x" values="12;588" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="28" y1="172" x2="588" y2="172" stroke="#30363d"/>
  <text x="28" y="188" class="lb">heartbeat: still shipping</text>
  <text x="588" y="188" class="lb" text-anchor="end">bpm 72<tspan class="cur" fill="#39d353"> ▌</tspan></text>

  <g class="rise" style="animation-delay:.15s">
    <circle cx="676" cy="96" r="30" fill="none" stroke="#161b22" stroke-width="8"/>
    <circle cx="676" cy="96" r="30" fill="none" stroke="#39d353" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 676 96)" filter="url(#mglow)">
      <animate attributeName="stroke-dashoffset" values="188.5;30" dur="1.8s" begin=".4s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" values="30;38;30" dur="3s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="676" y="101" class="vl" fill="#7ee787" text-anchor="middle">84%</text>
    <text x="676" y="146" class="lb" text-anchor="middle">focus</text>
  </g>

  <g class="rise" style="animation-delay:.30s">
    <circle cx="784" cy="96" r="30" fill="none" stroke="#161b22" stroke-width="8"/>
    <circle cx="784" cy="96" r="30" fill="none" stroke="#f0883e" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 784 96)" filter="url(#mglow)">
      <animate attributeName="stroke-dashoffset" values="188.5;12" dur="1.8s" begin=".6s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" values="12;24;12" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="784" y="101" class="vl" fill="#ffbd2e" text-anchor="middle">94%</text>
    <text x="784" y="146" class="lb" text-anchor="middle">caffeine</text>
  </g>

  <g class="rise" style="animation-delay:.45s">
    <circle cx="892" cy="96" r="30" fill="none" stroke="#161b22" stroke-width="8"/>
    <circle cx="892" cy="96" r="30" fill="none" stroke="#bc8cff" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 892 96)" filter="url(#mglow)">
      <animate attributeName="stroke-dashoffset" values="188.5;150" dur="1.8s" begin=".8s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" values="150;168;150" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="892" y="101" class="vl" fill="#d2a8ff" text-anchor="middle">21%</text>
    <text x="892" y="146" class="lb" text-anchor="middle">sleep</text>
  </g>

  <g>
    <text x="628" y="188" class="lb">bugs squashed today</text>
    <g fill="#39d353">
      <rect x="628" y="200" width="7" height="6" rx="1.5"><animate attributeName="height" values="6;16;6" dur="1.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="640" y="200" width="7" height="6" rx="1.5" fill="#58a6ff"><animate attributeName="height" values="6;16;6" dur="1.8s" begin=".15s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin=".15s" repeatCount="indefinite"/></rect>
      <rect x="652" y="200" width="7" height="6" rx="1.5" fill="#bc8cff"><animate attributeName="height" values="6;16;6" dur="1.8s" begin=".3s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin=".3s" repeatCount="indefinite"/></rect>
      <rect x="664" y="200" width="7" height="6" rx="1.5" fill="#39c5cf"><animate attributeName="height" values="6;16;6" dur="1.8s" begin=".45s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin=".45s" repeatCount="indefinite"/></rect>
      <rect x="676" y="200" width="7" height="6" rx="1.5" fill="#ffbd2e"><animate attributeName="height" values="6;16;6" dur="1.8s" begin=".6s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin=".6s" repeatCount="indefinite"/></rect>
      <rect x="688" y="200" width="7" height="6" rx="1.5" fill="#ff7b72"><animate attributeName="height" values="6;16;6" dur="1.8s" begin=".75s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin=".75s" repeatCount="indefinite"/></rect>
      <rect x="700" y="200" width="7" height="6" rx="1.5" fill="#7ee787"><animate attributeName="height" values="6;16;6" dur="1.8s" begin=".9s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin=".9s" repeatCount="indefinite"/></rect>
      <rect x="712" y="200" width="7" height="6" rx="1.5" fill="#79c0ff"><animate attributeName="height" values="6;16;6" dur="1.8s" begin="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="206;196;206" dur="1.8s" begin="1.05s" repeatCount="indefinite"/></rect>
    </g>
    <text x="952" y="207" class="lb" text-anchor="end">enough<tspan fill="#39d353"> ✦</tspan></text>
  </g>

  <rect x="0" y="-50" width="980" height="50" fill="#39d353" opacity=".04">
    <animate attributeName="y" values="-50;230" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x=".8" y=".8" width="978.4" height="228.4" rx="14" fill="none" stroke="#30363d"/>
<rect x=".8" y=".8" width="978.4" height="228.4" rx="14" fill="none" stroke="url(#medge)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="130 2250" filter="url(#mglow)">
  <animate attributeName="stroke-dashoffset" values="-2380;0" dur="8s" repeatCount="indefinite"/>
</rect>
</svg>