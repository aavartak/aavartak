<svg xmlns="http://www.w3.org/2000/svg" width="980" height="196" viewBox="0 0 980 196" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0d1117"/><stop offset="60%" stop-color="#0f1626"/><stop offset="100%" stop-color="#111a2b"/>
</linearGradient>
<linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353"/><stop offset="100%" stop-color="#39c5cf"/>
</linearGradient>
<linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#bc8cff"/>
</linearGradient>
<linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#f0883e"/><stop offset="100%" stop-color="#ff7b72"/>
</linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity=".35"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<filter id="fglow"><feGaussianBlur stdDeviation="1.9" result="b"><animate attributeName="stdDeviation" values="1.2;2.6;1.2" dur="3.6s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="fclip"><rect x="0" y="0" width="980" height="196" rx="14"/></clipPath>
<clipPath id="b1"><rect x="0" y="0" width="980" height="196"/></clipPath>
<style>
.hd{font-size:13px;font-weight:700;fill:#f0883e}
.lb{font-size:12px;fill:#c9d1d9}
.pc{font-size:11px;fill:#8b949e}
.tk{font-size:12px;fill:#8b949e}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cur{animation:blink .85s step-end infinite}
.row{opacity:0;animation:rise .6s cubic-bezier(.2,1.4,.3,1) forwards}
.fl{animation:drift 4.2s ease-in-out infinite}
</style>
</defs>

<rect width="980" height="196" rx="14" fill="url(#fbg)"/>

<g clip-path="url(#fclip)">
  <g stroke="#30363d" stroke-width=".5" opacity=".35">
    <path d="M0 44h980"/>
    <path d="M652 44V196"/>
  </g>

  <!-- drifting grid dots -->
  <g fill="#30363d">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;28 0" dur="9s" repeatCount="indefinite"/>
      <circle cx="40" cy="60" r="1"/><circle cx="124" cy="96" r="1"/><circle cx="240" cy="72" r="1"/>
      <circle cx="360" cy="140" r="1"/><circle cx="520" cy="66" r="1"/><circle cx="600" cy="160" r="1"/>
      <circle cx="720" cy="88" r="1"/><circle cx="880" cy="150" r="1"/><circle cx="940" cy="70" r="1"/>
    </g>
  </g>

  <text x="28" y="28" class="hd">— current focus</text>
  <circle cx="182" cy="23" r="3.2" fill="#39d353" filter="url(#fglow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="28" class="pc">live</text>

  <text x="676" y="28" class="hd" fill="#58a6ff">— build log</text>
  <text x="952" y="28" class="pc" text-anchor="end">always shipping
    <animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- progress rows -->
  <g class="row" style="animation-delay:.15s">
    <text x="28" y="76" class="lb">systems programming</text>
    <text x="612" y="76" class="pc" text-anchor="end">86%</text>
    <rect x="28" y="84" width="584" height="8" rx="4" fill="#161b22" stroke="#30363d" stroke-width=".7"/>
    <rect x="28" y="84" width="0" height="8" rx="4" fill="url(#bar1)" filter="url(#fglow)">
      <animate attributeName="width" values="0;502" dur="1.6s" begin=".4s" fill="freeze"/>
    </rect>
    <rect x="28" y="84" width="70" height="8" rx="4" fill="url(#shine)" opacity=".8">
      <animate attributeName="x" values="28;460;28" dur="5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="530" cy="88" r="3" fill="#39c5cf" opacity="0" filter="url(#fglow)">
      <animate attributeName="opacity" values="0;1" begin="2s" dur=".4s" fill="freeze"/>
      <animate attributeName="r" values="2.2;4;2.2" dur="2.1s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="row" style="animation-delay:.3s">
    <text x="28" y="118" class="lb">react · interface craft</text>
    <text x="612" y="118" class="pc" text-anchor="end">72%</text>
    <rect x="28" y="126" width="584" height="8" rx="4" fill="#161b22" stroke="#30363d" stroke-width=".7"/>
    <rect x="28" y="126" width="0" height="8" rx="4" fill="url(#bar2)" filter="url(#fglow)">
      <animate attributeName="width" values="0;420" dur="1.6s" begin=".6s" fill="freeze"/>
    </rect>
    <rect x="28" y="126" width="70" height="8" rx="4" fill="url(#shine)" opacity=".8">
      <animate attributeName="x" values="28;378;28" dur="5.6s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="448" cy="130" r="3" fill="#bc8cff" opacity="0" filter="url(#fglow)">
      <animate attributeName="opacity" values="0;1" begin="2.2s" dur=".4s" fill="freeze"/>
      <animate attributeName="r" values="2.2;4;2.2" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="row" style="animation-delay:.45s">
    <text x="28" y="160" class="lb">offensive security · ctf</text>
    <text x="612" y="160" class="pc" text-anchor="end">58%</text>
    <rect x="28" y="168" width="584" height="8" rx="4" fill="#161b22" stroke="#30363d" stroke-width=".7"/>
    <rect x="28" y="168" width="0" height="8" rx="4" fill="url(#bar3)" filter="url(#fglow)">
      <animate attributeName="width" values="0;339" dur="1.6s" begin=".8s" fill="freeze"/>
    </rect>
    <rect x="28" y="168" width="70" height="8" rx="4" fill="url(#shine)" opacity=".8">
      <animate attributeName="x" values="28;297;28" dur="6.2s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="367" cy="172" r="3" fill="#ff7b72" opacity="0" filter="url(#fglow)">
      <animate attributeName="opacity" values="0;1" begin="2.4s" dur=".4s" fill="freeze"/>
      <animate attributeName="r" values="2.2;4;2.2" dur="2.7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- checklist -->
  <g class="fl">
    <g class="row" style="animation-delay:.6s">
      <path d="M676 70 l5 6 9-12" fill="none" stroke="#39d353" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="26" stroke-dashoffset="26">
        <animate attributeName="stroke-dashoffset" values="26;0" dur=".5s" begin="1s" fill="freeze"/>
      </path>
      <text x="700" y="74" class="tk">shipped: pointer-safe parser</text>
    </g>
    <g class="row" style="animation-delay:.75s">
      <path d="M676 104 l5 6 9-12" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="26" stroke-dashoffset="26">
        <animate attributeName="stroke-dashoffset" values="26;0" dur=".5s" begin="1.3s" fill="freeze"/>
      </path>
      <text x="700" y="108" class="tk">reading: sql query plans</text>
    </g>
    <g class="row" style="animation-delay:.9s">
      <rect x="675" y="128" width="15" height="15" rx="4" fill="none" stroke="#bc8cff" stroke-width="1.4" opacity=".9">
        <animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="700" y="141" class="tk">next: kernel modules</text>
    </g>
    <g class="row" style="animation-delay:1.05s">
      <text x="676" y="174" class="tk" fill="#7ee787" xml:space="preserve">$ make progress <tspan class="cur" fill="#39d353">▌</tspan></text>
    </g>
  </g>

  <!-- scanline sweep -->
  <rect x="0" y="-46" width="980" height="46" fill="#58a6ff" opacity=".05">
    <animate attributeName="y" values="-46;196" dur="7.5s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x=".8" y=".8" width="978.4" height="194.4" rx="14" fill="none" stroke="#30363d" stroke-width="1.2">
  <animate attributeName="stroke" values="#30363d;#39d353;#58a6ff;#bc8cff;#30363d" dur="12s" repeatCount="indefinite"/>
</rect>
</svg>
