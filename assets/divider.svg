<svg xmlns="http://www.w3.org/2000/svg" width="980" height="18" viewBox="0 0 980 18">
<defs>
<linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353" stop-opacity="0"/>
  <stop offset="25%" stop-color="#39d353" stop-opacity=".9"/>
  <stop offset="50%" stop-color="#58a6ff" stop-opacity=".9"/>
  <stop offset="75%" stop-color="#bc8cff" stop-opacity=".9"/>
  <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
  <animate attributeName="x1" values="0;.3;0" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="1;.7;1" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<filter id="dglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<line x1="0" y1="9" x2="980" y2="9" stroke="url(#dline)" stroke-width="2"/>
<g filter="url(#dglow)">
  <circle cx="0" cy="9" r="3.2" fill="#39d353">
    <animate attributeName="cx" values="20;960;20" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="9" r="1.8" fill="#58a6ff" opacity=".7">
    <animate attributeName="cx" values="960;20;960" dur="8s" repeatCount="indefinite"/>
  </circle>
</g>
<g fill="#8b949e">
  <circle cx="470" cy="9" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="490" cy="9" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" begin=".3s" repeatCount="indefinite"/></circle>
  <circle cx="510" cy="9" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" begin=".6s" repeatCount="indefinite"/></circle>
</g>
</svg>