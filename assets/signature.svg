<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="130" viewBox="0 0 980 130" font-family="Segoe Script, Brush Script MT, Comic Sans MS, JetBrains Mono, cursive">
<defs>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#39d353"/><stop offset="50%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#bc8cff"/>
  <animate attributeName="x1" values="-.6;.3;-.6" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="1;1.9;1" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<filter id="iglow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.sig{font-size:52px;font-weight:700;letter-spacing:2px}
.cap{font-size:11.5px;fill:#8b949e;font-family:JetBrains Mono, DejaVu Sans Mono, monospace}
</style>
</defs>

<text x="490" y="68" class="sig" text-anchor="middle" fill="none" stroke="url(#ink)" stroke-width="1.4"
      stroke-dasharray="1600" stroke-dashoffset="1600" filter="url(#iglow)">aavartak
  <animate attributeName="stroke-dashoffset" values="1600;0" dur="3.2s" fill="freeze"/>
</text>
<text x="490" y="68" class="sig" text-anchor="middle" fill="url(#ink)" opacity="0">aavartak
  <animate attributeName="opacity" values="0;.9" begin="3s" dur="1.4s" fill="freeze"/>
</text>

<path id="flourish" d="M320 86 C 400 100, 560 100, 660 82" fill="none" stroke="url(#ink)" stroke-width="2" stroke-linecap="round"
      stroke-dasharray="380" stroke-dashoffset="380" filter="url(#iglow)">
  <animate attributeName="stroke-dashoffset" values="380;0" dur="1.2s" begin="3.1s" fill="freeze"/>
</path>

<g fill="#39d353" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="4.2s" dur=".4s" fill="freeze"/>
  <circle cx="668" cy="80" r="2.4"><animate attributeName="r" values="1.6;3.6;1.6" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="690" cy="66" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="304" cy="88" r="1.8" fill="#bc8cff"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
</g>

<text x="490" y="112" class="cap" text-anchor="middle" opacity="0">signed, sealed, version-controlled
  <animate attributeName="opacity" values="0;.9" begin="4.4s" dur=".8s" fill="freeze"/>
</text>

<g opacity="0" filter="url(#iglow)">
  <animate attributeName="opacity" values="0;1" begin="4.2s" dur=".4s" fill="freeze"/>
  <circle r="2.6" fill="#39d353">
    <animateMotion dur="5.5s" begin="4.4s" repeatCount="indefinite"><mpath href="#flourish" xlink:href="#flourish"/></animateMotion>
    <animate attributeName="fill" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="5.5s" begin="4.4s" repeatCount="indefinite"/>
  </circle>
</g>
<g stroke="#58a6ff" stroke-width="1" opacity="0">
  <animate attributeName="opacity" values="0;.7" begin="4.6s" dur=".6s" fill="freeze"/>
  <path d="M258 40 v10 M253 45 h10"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></path>
  <path d="M726 52 v10 M721 57 h10" stroke="#bc8cff"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></path>
  <path d="M690 34 v8 M686 38 h8" stroke="#39d353"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></path>
</g>
</svg>